# ButtonFu Extension — Drive.NET UI Test Manifest
#
# Prerequisites:
#   1. Launch the `Run Extension (Isolated Smoke Test)` debug configuration in VS Code.
#   2. Ensure Drive.NET CLI is installed.
#   3. For the proposed future attach-only/shared-session version, see
#      `manifest.proposed.yaml` and `../../drivenet-changes.md`.
#
# Run:
#   Preferred from `buttonfu-extension/`:
#     npm run test:drive-net
#   Preferred from VS Code:
#     Run the `Drive.NET: manifest smoke - buttonfu-extension` task.
#   Direct script entry point:
#     pwsh -NoProfile -ExecutionPolicy Bypass -File tests/drive-net/Run-Manifest.ps1

name: ButtonFu Extension UI Tests
suites:
  - activation.yaml
  - note-crud.yaml
  - button-crud.yaml
  - claude-button.yaml
  - cleanup.yaml
